<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JJ英語</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Bungee&family=Huninn&family=Noto+Sans+TC:wght@400;700;900&display=swap">
<style>
/* 版面：手繪冒險地圖風。奶油黃底、珊瑚橘主色、咖啡色粗框＋貼紙陰影，按鈕都像可以按下去的糖果。 */
:root{
  --bg:#fff0be;
  --paper:#fffaf0;
  --card:#fffdf7;
  --coral:#ff9a86;
  --peach:#ffb399;
  --apricot:#ffd6a6;
  --cream:#fff0be;
  --ink:#5b3427;
  --muted:#9a6b58;
  --line:#efd3b5;
  --accent:#ff9a86;
  --accent-deep:#e8664f;
  --accent-soft:#ffe6dc;
  --hi:#ffe066;
  --leaf:#7cc36a;
  --sky:#7cc8ee;
  --good:#3fae6a;
  --good-soft:#dcf5e3;
  --bad:#e5533d;
  --bad-soft:#ffe1da;
  --pen-me:#1f5fd6;
  --pen-mom:#d43a33;
  --shadow:0 4px 0 #5b342733;
  --en:"Andika","Comic Sans MS",system-ui,sans-serif;
  --zh:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background-color:var(--bg);background-image:radial-gradient(#f6d79a 1.4px,transparent 1.6px);background-size:26px 26px;color:var(--ink);font-family:var(--zh);font-size:17px;line-height:1.5;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--accent-deep);outline-offset:2px}
button:disabled{opacity:.4;cursor:default}
.en{font-family:var(--en)}
.wrap{max-width:980px;margin:0 auto}

/* 頂部列 */
.top{display:flex;align-items:center;gap:8px;padding-block:12px;flex-wrap:wrap}
.top .crumb{flex:1 1 calc(100% - 150px);min-width:0;display:flex;align-items:center;gap:8px}   /* 標題自己一行，按鈕排在下一行，標題才不會被擠掉 */
.top .crumb.home{flex:1 1 auto}
.top .crumb b{font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{height:46px;min-width:46px;padding:0 14px;border-radius:16px;background:var(--card);border:2.5px solid var(--ink);box-shadow:var(--shadow);display:inline-flex;align-items:center;gap:6px;font-size:16px}
.iconbtn:active,.big:active,.toggle:active,.tile:active{transform:translateY(3px);box-shadow:none}
.chip{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 14px;border-radius:999px;font-size:15px;background:var(--card);border:2.5px solid var(--ink)}
.dot{width:11px;height:11px;border-radius:50%;background:#c9b8a6;border:2px solid var(--ink)}
.chip.on .dot{background:var(--good)}
.chip.wait .dot{background:var(--hi)}
.kjchip{gap:4px;padding:0 12px 0 4px;font-weight:700;font-family:var(--en);font-size:19px;font-variant-numeric:tabular-nums;background:var(--apricot)}
.kjchip .kj{width:36px;height:36px}
svg.kj{overflow:visible}

/* 首頁 */
.hero{padding-block:8px 4px;text-align:center}
.hero p{margin:4px 0 0;color:var(--muted)}
.connect{background:var(--card);border:3px solid var(--ink);border-radius:22px;box-shadow:var(--shadow);padding:18px;margin-block:12px;display:grid;gap:12px}
.connect h3{margin:0;font-size:20px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.big{height:56px;padding:0 24px;border-radius:18px;font-size:19px;font-weight:700;background:var(--coral);color:var(--ink);border:3px solid var(--ink);box-shadow:var(--shadow)}
.big.ghost{background:var(--card)}
.big.go{background:var(--leaf)}
.code{font-family:var(--en);font-size:42px;font-weight:700;letter-spacing:.12em;color:var(--accent-deep)}
.linkbox{font-family:ui-monospace,Menlo,monospace;font-size:14px;background:var(--cream);border:2px dashed var(--line);border-radius:12px;padding:10px 12px;word-break:break-all;-webkit-user-select:text;user-select:text;flex:1;min-width:0}
input.codein{height:56px;width:190px;font:700 28px var(--en);letter-spacing:.15em;text-align:center;border:3px solid var(--ink);border-radius:16px;color:var(--ink);background:var(--card)}
.hint{color:var(--muted);font-size:15px;margin:0}

/* 學習檔案列 */
.me{display:flex;gap:12px;flex-wrap:wrap;align-items:center;background:var(--card);border:3px solid var(--ink);border-radius:22px;box-shadow:var(--shadow);padding:10px 16px;margin-block:12px}
.stat{display:flex;align-items:center;gap:6px;padding-right:14px;border-right:2px dashed var(--line)}
.stat:last-of-type{border-right:0}
.stat b{font:700 28px var(--en);font-variant-numeric:tabular-nums}
.stat span{font-size:14px;color:var(--muted)}
.stat .kj{width:44px;height:44px}
.me .sp{flex:1}

/* 冒險地圖 */
.mapbox{background:#fff7e3;border:4px solid #8a5a3c;border-radius:26px;box-shadow:0 0 0 6px #fff7e3,0 0 0 9px #c9946a,0 8px 0 9px #5b342722;margin:16px 4px 24px;overflow:hidden}
.mapbox svg{display:block;width:100%;height:auto}
.mapbox .node{cursor:pointer}
.mapbox .node:active .pin{transform:scale(.92)}
.mapbox .pin{transform-box:fill-box;transform-origin:center}
.mapbox .next .ring{animation:ring 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
.mapbox .flag{animation:bob 1.4s ease-in-out infinite;transform-box:fill-box}
@keyframes ring{0%{transform:scale(.9);opacity:1}100%{transform:scale(1.5);opacity:0}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* 上課畫面 */
.stepbar{display:flex;gap:8px;overflow-x:auto;padding-block:2px 12px}
.stepbar button{flex:none;height:40px;padding:0 14px;border-radius:999px;background:var(--card);border:2.5px solid var(--ink);font-size:15px;color:var(--muted)}
.stepbar button.cur{background:var(--hi);color:var(--ink);font-weight:700;box-shadow:var(--shadow)}
.stage{background:var(--card);border-radius:26px;border:3px solid var(--ink);box-shadow:0 6px 0 #5b342733;padding:20px;min-height:52vh;display:flex;flex-direction:column;gap:14px}
.stage h3{margin:0;font-size:23px}
.tip{font-size:14px;color:var(--muted);background:var(--cream);border-radius:14px;padding:8px 12px;margin:0;border:2px dashed #f2cf8f}
.tip b{color:var(--ink)}
.bottom{display:flex;gap:10px;justify-content:space-between;padding-block:14px 24px}
.bottom .big{min-width:130px}

/* 單字卡 */
.tools{display:flex;gap:8px;flex-wrap:wrap}
.toggle{height:44px;padding:0 14px;border-radius:14px;border:2.5px solid var(--ink);background:var(--card);font-size:15px;box-shadow:0 3px 0 #5b342733}
.toggle.on{background:var(--ink);color:var(--cream)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.wcard{border:3px solid var(--ink);border-radius:20px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--card);min-height:150px;justify-content:center;box-shadow:0 4px 0 #5b342733;transition:background .15s,transform .15s}
.cards .wcard:nth-child(4n+1){background:#fff1ec}
.cards .wcard:nth-child(4n+2){background:#fff6e6}
.cards .wcard:nth-child(4n+3){background:#fffbe8}
.cards .wcard:nth-child(4n+4){background:#f0f9ea}
.wcard .pic{font-size:48px;line-height:1.1;height:58px;display:flex;align-items:center}
.wcard .pic.txt{font:700 32px var(--en);color:var(--accent-deep);background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:0 12px;height:52px}
.wcard .w{font-family:var(--en);font-size:25px;font-weight:700;line-height:1.2;text-align:center}
.wcard .w.hidden{color:transparent;background:repeating-linear-gradient(90deg,var(--muted) 0 14px,transparent 14px 20px);background-size:100% 4px;background-repeat:no-repeat;background-position:0 80%;min-width:90px}
.wcard .z{font-size:15px;color:var(--muted)}
.cards .wcard.flash{background:var(--hi);transform:rotate(-2deg) scale(1.04)}

/* 發音 */
.ph-groups{display:grid;gap:12px}
.ph-group{border:3px dashed var(--peach);border-radius:22px;padding:12px;display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:center;background:#fffaf3}
.ph-key{text-align:center}
.ph-key .p{font:700 40px var(--en);color:var(--accent-deep)}
.ph-key .s{font-size:14px;color:var(--muted)}
.ph-group .cards{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.ph-group .wcard{min-height:120px}
.mark{color:var(--bad);text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:4px}

/* 對話 */
.dlg{display:grid;gap:14px}
.pair{display:grid;gap:6px}
.bub{display:flex;align-items:center;gap:10px;max-width:92%;padding:12px 16px;border-radius:22px;font:700 23px/1.3 var(--en);text-align:left;border:3px solid var(--ink);box-shadow:0 4px 0 #5b342733}
.bub .who{font:700 14px var(--zh);flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--ink);border:2.5px solid var(--ink)}
.bub.a{background:#ffe6dc;justify-self:start;border-bottom-left-radius:6px}
.bub.a .who{background:var(--coral)}
.bub.b{background:#e4f4fb;justify-self:end;border-bottom-right-radius:6px}
.bub.b .who{background:var(--sky)}
.bub.flash{background:var(--hi)}
.zhline{font-size:14px;color:var(--muted);padding-left:6px}
.note{border:2.5px solid var(--ink);background:#fff6d9;border-radius:16px;padding:10px 14px;font-size:16px;position:relative}
.note::before{content:"💡";margin-right:6px}
.note .en{font-weight:700}
.phrases{display:flex;gap:10px;flex-wrap:wrap}
.phrase{padding:10px 14px;border-radius:16px;border:2.5px dashed var(--accent-deep);background:#fff;font:700 20px var(--en)}
.phrase small{display:block;font:400 13px var(--zh);color:var(--muted)}
.phrase.flash{background:var(--hi)}

/* 測驗 */
.qhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.qnum{font-size:15px;color:var(--muted);background:var(--cream);border-radius:999px;padding:2px 12px}
.speak{height:64px;padding:0 22px;border-radius:20px;background:var(--sky);color:var(--ink);border:3px solid var(--ink);box-shadow:var(--shadow);font-size:21px;font-weight:700;display:inline-flex;align-items:center;gap:8px}
.speak:active{transform:translateY(3px);box-shadow:none}
.prompt{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.prompt .pic{font-size:72px;line-height:1}
.prompt .pic.txt{font:700 44px var(--en);color:var(--accent-deep);background:#fff;border:3px solid var(--ink);border-radius:18px;padding:6px 18px}
.prompt .q{font:700 26px var(--en)}
.prompt .z{font-size:19px;color:var(--muted)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.opt{min-height:86px;border:3px solid var(--ink);border-radius:20px;padding:10px;display:flex;align-items:center;justify-content:center;gap:10px;font:700 24px var(--en);background:var(--card);text-align:center;box-shadow:0 4px 0 #5b342733}
.opt .pic{font-size:44px}
.opt .pic.txt{font:700 28px var(--en);color:var(--accent-deep)}
.opt.right{background:var(--good-soft);border-color:var(--good);box-shadow:0 4px 0 var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);box-shadow:0 4px 0 var(--bad)}
.opt.dim{opacity:.4}
.verdict{font-size:20px;font-weight:700;min-height:28px}
.verdict.ok{color:var(--good)}
.verdict.no{color:var(--bad)}
.score{font-size:22px;font-weight:700;text-align:center;padding:20px 10px;display:grid;gap:10px;justify-items:center}
.score .n{font:700 68px var(--en);color:var(--accent-deep)}

/* 排句子 */
.slot{min-height:80px;border:3px dashed var(--peach);border-radius:20px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#fffaf3}
.slot.ok{border-style:solid;border-color:var(--good);background:var(--good-soft)}
.slot.no{border-style:solid;border-color:var(--bad);background:var(--bad-soft)}
.pool{display:flex;flex-wrap:wrap;gap:10px;min-height:60px}
.tile{height:56px;padding:0 18px;border-radius:16px;background:var(--apricot);border:3px solid var(--ink);box-shadow:var(--shadow);font:700 24px var(--en);color:var(--ink)}
.tile.used{visibility:hidden}
.slot .tile{background:#fff}

/* 寫字板 */
.board-wrap{display:grid;gap:10px}
.board-target{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.board-target .w{font:700 30px var(--en)}
.board-target .z{color:var(--muted)}
canvas.board{width:100%;display:block;background:#fff;border:3px solid var(--ink);border-radius:20px;touch-action:none}
.pens{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.legend{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.legend i{width:14px;height:14px;border-radius:50%;display:inline-block;border:2px solid var(--ink)}
.pager{display:flex;align-items:center;gap:10px}
.pager span{font-size:15px;color:var(--muted);min-width:56px;text-align:center}
.stampbtn{background:var(--hi);font-weight:700}
.stamped{font-size:15px;color:var(--accent-deep);font-weight:700}
.wbtools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* 圖鑑、徽章 */
.tabs{display:flex;gap:8px;margin-block:6px 14px}
.tabs button{height:48px;padding:0 20px;border-radius:999px;border:3px solid var(--ink);background:var(--card);font-size:17px;font-weight:700}
.tabs button.cur{background:var(--coral);box-shadow:var(--shadow)}
.dexsec{margin-block:14px 6px;font-size:16px;color:var(--muted);display:flex;align-items:center;gap:8px}
.dexsec b{color:var(--ink);font-size:19px}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.mon{background:var(--card);border:3px solid var(--ink);border-radius:22px;box-shadow:var(--shadow);padding:10px 8px 12px;text-align:center;display:grid;justify-items:center;gap:2px;position:relative}
.mon .kj{width:104px;height:104px}
.mon b{font-size:17px}
.mon .no{position:absolute;left:10px;top:8px;font:700 13px var(--en);color:var(--muted)}
.mon .cnt{position:absolute;right:8px;top:8px;background:var(--hi);border:2px solid var(--ink);border-radius:999px;font:700 14px var(--en);padding:0 8px}
.mon .rar{font-size:12px;border-radius:999px;padding:0 10px;border:2px solid var(--ink)}
.mon.r1 .rar{background:#fff}
.mon.r2 .rar{background:var(--sky)}
.mon.r3 .rar{background:var(--hi)}
.mon.r4 .rar{background:var(--coral)}
.mon.r3{background:linear-gradient(160deg,#fff8d6,#fffdf7 60%)}
.mon.locked{background:#fbf2e2;box-shadow:none;border-style:dashed;border-color:#c9b8a6;color:#b9a48e}
.mon.locked b{color:#b9a48e}
.mon small{font-size:12.5px;color:var(--muted);line-height:1.4}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.badge{background:var(--card);border:3px solid var(--ink);border-radius:20px;box-shadow:var(--shadow);padding:12px;display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center}
.badge .bi{font-size:40px;text-align:center}
.badge.locked{border-style:dashed;border-color:#c9b8a6;box-shadow:none;background:#fbf2e2}
.badge.locked .bi{filter:grayscale(1);opacity:.35}
.badge b{display:block;font-size:16px}
.badge small{color:var(--muted);font-size:13px;display:block;line-height:1.4}
.badge.got{background:#fff6d9}

/* 抓到怪獸、慶祝 */
.overlay{position:fixed;inset:0;background:rgba(91,52,39,.5);display:grid;place-items:center;z-index:60;padding:20px}
.cele{background:var(--card);border:4px solid var(--ink);border-radius:28px;box-shadow:0 8px 0 #5b342755;padding:26px 24px;text-align:center;max-width:360px;width:100%;display:grid;gap:6px;justify-items:center;animation:pop .45s cubic-bezier(.2,1.4,.4,1);background-image:radial-gradient(circle at 50% 30%,#fff0be 0 90px,transparent 91px)}
.cele .bi{font-size:84px;line-height:1}
.cele .kj{width:150px;height:150px;animation:wiggle 1.2s ease-in-out infinite}
.cele .h{font-size:16px;color:var(--accent-deep);font-weight:700;letter-spacing:.06em}
.cele .n{font-size:28px;font-weight:700}
.cele p{margin:0;color:var(--muted)}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes wiggle{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.catch{position:fixed;left:50%;top:38%;z-index:55;pointer-events:none;text-align:center;animation:catch 1.9s ease-out forwards;transform:translate(-50%,-50%)}
.catch .kj{width:150px;height:150px;filter:drop-shadow(0 6px 0 #5b342733)}
.catch .t{font-size:22px;font-weight:700;color:var(--ink);background:var(--hi);border:3px solid var(--ink);border-radius:16px;padding:4px 16px;display:inline-block;white-space:nowrap}
@keyframes catch{0%{transform:translate(-50%,10%) scale(.3);opacity:0}20%{transform:translate(-50%,-50%) scale(1.1);opacity:1}30%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{transform:translate(-50%,-80%) scale(.9);opacity:0}}

/* 設定 */
.settings{display:grid;gap:10px}
.settings input{height:52px;border:3px solid var(--ink);border-radius:14px;padding:0 12px;font:15px ui-monospace,Menlo,monospace;width:100%;min-width:0;color:var(--ink);background:var(--card);-webkit-user-select:text;user-select:text}
.ok-text{color:var(--good);font-weight:700}
.err-text{color:var(--bad);font-weight:700}

/* 畫筆圖層：蓋在整個網頁上 */
#page{position:relative}
#ink{position:absolute;left:0;top:0;pointer-events:none;z-index:30}
body.pen #ink{pointer-events:auto;touch-action:none;cursor:crosshair}
.penbar{position:fixed;right:calc(10px + env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);z-index:40;display:flex;flex-direction:column;gap:8px}
.penbar button{width:62px;min-height:62px;border-radius:20px;background:var(--card);color:var(--ink);border:3px solid var(--ink);box-shadow:var(--shadow);font-size:13px;line-height:1.2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 2px}
.penbar button .ic{font-size:24px}
.penbar .pen.on{background:var(--hi);font-weight:700}
body.pen .wrap{outline:4px dashed var(--accent-deep);outline-offset:6px;border-radius:14px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--cream);padding:10px 18px;border-radius:14px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50;max-width:90vw}
.toast.show{opacity:1}


/* ===== 怪獸電影風（地圖、圖鑑頁）===== */
:root{--n-bg:#0a0f1c;--n-panel:#121a2b;--n-line:#2b3a55;--n-cyan:#3ef0ff;--n-alert:#ff3b3b;--n-text:#e8f0ff;--n-muted:#8fa3c4;--n-yellow:#ffd400;--n-head:"Bungee","Noto Sans TC",Impact,sans-serif;--n-zh:"Noto Sans TC","PingFang TC",sans-serif}
body.night{background-color:var(--n-bg);background-image:linear-gradient(#3ef0ff0d 1px,transparent 1px),linear-gradient(90deg,#3ef0ff0d 1px,transparent 1px);background-size:40px 40px;color:var(--n-text);font-family:var(--n-zh)}
body.night .iconbtn,body.night .chip{background:var(--n-panel);color:var(--n-text);border-color:#3ef0ff66;box-shadow:none}
body.night .kjchip{background:var(--n-panel)}
body.night .connect,body.night .me{background:var(--n-panel);border:2px solid var(--n-line);box-shadow:0 0 0 1px #000,0 10px 30px #0008;color:var(--n-text)}
body.night .stat{border-right-color:var(--n-line)}
body.night .hint,body.night .stat span{color:var(--n-muted)}
body.night .big{background:var(--n-yellow);color:#0a0f1c;border-color:#000;box-shadow:0 4px 0 #000;font-family:var(--n-zh);font-weight:900}

<script>

const W = (en, zh, pic) => ({en, zh, pic});
const HANLIN5A = [
 {id:'st', en:'Starter', zh:'開學預備', topics:[

  {id:'ph1', kind:'phonics', title:'發音 a_e · ai · ay', goal:'看到 a_e、ai、ay 都念「ㄟ」的長音 /e/',
   groups:[{p:'a_e',s:'/e/',words:[W('cake','蛋糕','🎂'),W('lake','湖','🏞️')]},

 ]},
 {id:'u2', en:'Unit 2', zh:'Do You Have PE Class on Monday?', topics:[

 {id:'u3', en:'Unit 3', zh:'Where Are You Going?', topics:[

function kaijuSVG(k, opt={}){
  const sil = opt.locked;
  const ink = sil ? '#2c3850' : BORDER;
  const fill = c => sil ? '#151b28' : c;
  const id = 'g'+k.id+(sil?'x':'');
  const eyeC = sil ? '#ff3b3b' : (k.e||'#ffe14d');
  let defs = `<filter id="gl${id}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.6"/></filter>`;
  let spikeFill = k.s;
  if(k.s==='rainbow' && !sil){defs+=`<linearGradient id="${id}" x1="0" x2="1"><stop offset="0" stop-color="#ff4d4d"/><stop offset=".25" stop-color="#ffd23d"/><stop offset=".5" stop-color="#3fcf6a"/><stop offset=".75" stop-color="#3d8bff"/><stop offset="1" stop-color="#a24dff"/></linearGradient>`;spikeFill=`url(#${id})`}
  const sf = sil ? '#1c2333' : spikeFill;
  let g = '';
  // 背上的刺
  const arc = [[-66,30],[-40,27],[-14,25],[12,27],[38,30],[62,24]];
  const lv=opt.lv||1,grow=lv===3?1.35:lv===2?1.18:1;
  const pts = arc.map(([a,sz])=>{const r=a*Math.PI/180;return [50+Math.sin(r)*40,58-Math.cos(r)*36,a,sz*grow]});
  pts.forEach(([x,y,a,sz])=>{
    const rot=`rotate(${a} ${x} ${y})`;
    if(k.sp==='tri'||k.sp==='sun')g+=`<path d="M${x-sz*.36} ${y+4} L${x+sz*.08} ${y-sz*1.05} L${x+sz*.36} ${y+4} Z" fill="${sf}" stroke="${ink}" stroke-width="3" stroke-linejoin="round" transform="${rot}"/>`;
    else if(k.sp==='round'||k.sp==='cloud')g+=`<path d="M${x-sz*.4} ${y+4} Q${x-sz*.45} ${y-sz*.7} ${x} ${y-sz*.8} Q${x+sz*.45} ${y-sz*.7} ${x+sz*.4} ${y+4} Z" fill="${sf}" stroke="${ink}" stroke-width="3" transform="${rot}"/>`;
    else if(k.sp==='crystal')g+=`<path d="M${x-sz*.28} ${y+4} L${x-sz*.3} ${y-sz*.6} L${x} ${y-sz*1.15} L${x+sz*.3} ${y-sz*.6} L${x+sz*.28} ${y+4} Z" fill="${sf}" stroke="${ink}" stroke-width="3" stroke-linejoin="round" transform="${rot}"/>${sil?'':`<path d="M${x} ${y-sz*1.0} L${x} ${y-sz*.2}" stroke="#fff" stroke-width="1.6" opacity=".6" transform="${rot}"/>`}`;
    else if(k.sp==='leaf')g+=`<path d="M${x} ${y+4} C${x-sz*.55} ${y-sz*.3} ${x-sz*.25} ${y-sz*.9} ${x+sz*.15} ${y-sz*1.05} C${x+sz*.25} ${y-sz*.6} ${x+sz*.5} ${y-sz*.2} ${x} ${y+4} Z" fill="${sf}" stroke="${ink}" stroke-width="3" transform="${rot}"/>`;
    else if(k.sp==='fin')g+=`<path d="M${x-sz*.45} ${y+4} Q${x-sz*.1} ${y-sz*1.1} ${x+sz*.55} ${y-sz*.9} Q${x+sz*.2} ${y-sz*.3} ${x+sz*.4} ${y+4} Z" fill="${sf}" stroke="${ink}" stroke-width="3" stroke-linejoin="round" transform="${rot}"/>`;
  });

/* ===================== 工具 ===================== */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isEmoji = s => /\p{Extended_Pictographic}/u.test(s);
const picHTML = (p,cls='pic') => isEmoji(p) ? `<span class="${cls}">${p}</span>` : `<span class="${cls} txt">${esc(p)}</span>`;
function hash(str){let h=1779033703^str.length;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19}return h>>>0}
function rng(seed){let a=hash(seed);return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(arr,seed){const r=rng(seed),a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const store = {get(k,d){try{const v=localStorage.getItem('hl5:'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('hl5:'+k,JSON.stringify(v))}catch(e){}}};
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2200)}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const tidOf=(u,t)=>UNITS[u].id+'-'+UNITS[u].topics[t].id;

function pickVoice(){const vs=speechSynthesis.getVoices();voice=vs.find(v=>/en[-_]US/i.test(v.lang)&&/Samantha|Google|Aaron|Nicky/i.test(v.name))||vs.find(v=>/en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
let momMute=store.get('momMute',false);
// 聲音開關（只有媽媽看得到）：單字發音和音樂都用這一個
const muteLabel=()=>momMute?'🔇 聲音：只有'+kidName():'🔊 聲音：兩邊';
function toggleMute(rerender=true){
  momMute=!momMute;store.set('momMute',momMute);
  toast(momMute?'你這台不出聲了，單字和音樂只從'+kidName()+'的平板播（沒連線時你這台還是會發音）':'單字和音樂兩台平板都會播');

let ttsWarned=false;
function ttsWarn(){if(ttsWarned)return;ttsWarned=true;toast('這個瀏覽器沒辦法發音，請用 iPad 的 Safari 打開；也請確認沒有開靜音')}
function say(text){
  if(role==='mom'&&momMute&&status==='on')return;   // 只在兒子那邊發音
  if(!('speechSynthesis' in window)||typeof SpeechSynthesisUtterance==='undefined'){ttsWarn();return}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text.replace(/^a /,'a, '));
  u.lang='en-US';if(voice)u.voice=voice;u.rate=slow?0.72:0.95;
  let started=false;u.onstart=()=>{started=true};u.onerror=e=>{if(e&&e.error!=='interrupted'&&e.error!=='canceled')ttsWarn()};
  speechSynthesis.speak(u);
  setTimeout(()=>{if(!started&&!speechSynthesis.speaking&&!speechSynthesis.getVoices().length)ttsWarn()},1800);
}
let unlocked=false;
document.addEventListener('pointerdown',()=>{if(unlocked||!('speechSynthesis' in window))return;unlocked=true;const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)},{capture:true});

// 題目難度：1 短單字、2 中長單字、3 長單字/片語/句子。越難越容易遇到稀有、傳說怪獸
function difficultyOf(key){
  const t=(keyText(key)||'').replace(/^a /,''),letters=t.replace(/[^A-Za-z]/g,'').length;
  if(key.startsWith('b|')||/[?.!]$/.test(t))return 3;   // 句子
  if(t.includes(' ')||letters>=9)return 3;              // 片語、長單字（social studies、Wednesday…）
  return letters>=6?2:1;
}
const ODDS={1:[85,98],2:[65,94],3:[40,82]};   // [常見上限, 稀有上限]，其餘是傳說
// 每個字/句子固定對應一種怪獸，每種怪獸分到的字一樣多（差最多 1 個）
// 最難的句子給傳說、比較難的給稀有、其餘給常見
function allKeys(){const keys=[];
  UNITS.forEach(u=>u.topics.forEach(T=>{const tid=u.id+'-'+T.id;T.steps.forEach((st,si)=>{
    if(st.type==='quiz'){if(st.mode==='qa')T.qa.forEach(q=>keys.push('q|'+tid+'|'+si+'|'+q[0]));else poolOf(T).forEach(w=>keys.push('q|'+tid+'|'+si+'|'+w.en))}
    if(st.type==='build')T.build.forEach((x,i)=>keys.push('b|'+tid+'|'+si+'|'+i));
    if(st.type==='write')st.items.forEach((x,i)=>keys.push('s|'+tid+'|'+si+'|'+i));})}));
  return keys}
function textDifficulty(t){t=t.replace(/^a /,'');const letters=t.replace(/[^A-Za-z]/g,'').length;
  if(/[?.!]$/.test(t))return 3;if(t.includes(' ')||letters>=9)return 3;return letters>=6?2:1}
function buildText2Species(){
  const texts=[...new Set(allKeys().filter(k=>!k.startsWith('s|')).map(keyText).filter(Boolean))];   // 只用答題拿得到的字
  texts.sort((a,b)=>textDifficulty(b)-textDifficulty(a)||b.length-a.length||hash(a)-hash(b));
  const N=texts.length,q=N/KAIJU.length,nL=Math.round(q*LEGEND.length),nR=Math.round(q*RARE.length);
  const deal=(list,group,seed)=>shuffle(list,seed).forEach((t,i)=>{TEXT2SP[t]=group[i%group.length]});
  TEXT2SP={};
  deal(texts.slice(0,nL),LEGEND,'L');deal(texts.slice(nL,nL+nR),RARE,'R');deal(texts.slice(nL+nR),COMMON,'C');
}
function speciesOf(key){
  if(!TEXT2SP)buildText2Species();
  const t=keyText(key);if(t&&TEXT2SP[t])return TEXT2SP[t];
  const h=hash('kj:'+key);return COMMON[h%COMMON.length];
}

const poolOf=T=>T.kind==='phonics'?T.groups.flatMap(g=>g.words):T.words||[];
function earnable(T){let n=0;T.steps.forEach(st=>{if(st.type==='quiz')n+=st.mode==='qa'?T.qa.length:poolOf(T).length;if(st.type==='build')n+=T.build.length;if(st.type==='write')n+=st.items.length});return n}
function quizCount(T,st){if(st.mode==='qa')return T.qa.length;const pool=T.kind==='phonics'?T.groups.flatMap(g=>g.words):T.words;if(T.kind==='vocab')return Math.min(5,pool.length);return pool.length}

function mergeProg(inc){
  if(!inc||typeof inc!=='object')return;
  let changed=false;const newGot=[];
  ['got','topics','badges','days'].forEach(f=>{const src=inc[f];if(!src||typeof src!=='object')return;
    for(const k in src){if(!P[f][k]){P[f][k]=src[k];changed=true;if(f==='badges')celeQueue.push(k);if(f==='got')newGot.push(k)}}});
  if(inc.evo&&typeof inc.evo==='object')for(const k in inc.evo){const v=+inc.evo[k]||1;if(v>(P.evo[k]||1)){P.evo[k]=v;changed=true;if(booted&&status==='on')evoAnim(k,v)}}
  if(booted&&status==='on'&&newGot.length&&newGot.length<=2)newGot.forEach(k=>catchAnim(k));
  if(changed){checkBadges();store.set(progKey(),P);scheduleSave();updateCounters();showCele();if(nav.u<0)render()}
  return changed;
}

async function saveSheet(){

  const key=progKey(),body=JSON.stringify(Object.assign(sheetMeta(),{state:P,summary:curCourse()?summary():null,events:ev}));

    const j=await r.json();if(j&&j.students)rosterFromSheet(j.students,j.studentsAt);if(j&&j.state&&key===progKey())mergeProg(j.state);

const PREFIX='hlwow5-';

function setStatus(s){const was=status;status=s;renderChip();if(role==='kid'&&nav.u===-1&&(was==='on')!==(s==='on'))render()}
function send(m){if(conn&&conn.open){try{conn.send(m)}catch(e){}}}
function wire(c){
  c.on('data',onMsg);
  c.on('close',()=>{if(conn===c){conn=null;if(status!=='busy')setStatus(role==='mom'?'wait':'off');if(role==='kid')scheduleRetry()}});
  c.on('error',()=>{});
}
function startMom(){
  if(typeof Peer==='undefined'){toast('連線元件沒有載入，請確認網路後重新整理');return}
  if(!code){code=String(Math.floor(100000+Math.random()*900000));store.set('code',code)}
  role='mom';store.set('role','mom');
  if(peer)peer.destroy();
  peer=new Peer(PREFIX+code,{debug:0});
  setStatus('wait');
  peer.on('connection',c=>{
    // 先不換掉目前的連線：等這台說自己是誰，是媽媽正在陪的那個孩子才接進來
    const tell=m=>{try{c.send(m)}catch(e){}};
    c.on('data',m=>{
      if(c===conn)return onMsg(m);
      if(!m||typeof m!=='object')return;
      if(m.t==='hello')tell({t:'roster',list:STUDENTS,at:studentsAt});
      else if(m.t==='iam'){
        if(m.sid===(curStu()||{}).id){if(conn&&conn!==c)try{conn.close()}catch(e){}conn=c;onMsg(m)}
        else{const who=STUDENTS.find(x=>x.id===m.sid);tell({t:'busy',name:kidName()});setTimeout(()=>{try{c.close()}catch(e){}},400);
          if(who&&!busyTold[who.id]){busyTold[who.id]=1;toast(who.name+'也打開了，現在在陪'+kidName()+'，他會先自己練習')}}}
    });
    c.on('close',()=>{if(conn===c){conn=null;setStatus('wait')}});
    c.on('error',()=>{});
  });
  peer.on('disconnected',()=>{try{peer.reconnect()}catch(e){}});
  peer.on('error',e=>{
    if(e.type==='unavailable-id'){setStatus('wait');setTimeout(startMom,4000)}
    else if(e.type==='network'||e.type==='server-error'||e.type==='socket-error'){setStatus('err');setTimeout(startMom,5000)}
  });
  render();
}
function startKid(c){
  if(typeof Peer==='undefined'){toast('連線元件沒有載入，請確認網路後重新整理');return}
  code=c;store.set('code',c);role='kid';store.set('role','kid');
  if(peer)peer.destroy();
  if(status!=='busy')setStatus('wait');

  peer.on('open',()=>{const cc=peer.connect(PREFIX+c,{reliable:true});conn=cc;wire(cc);
    cc.on('open',()=>{send({t:'hello'})})});
  peer.on('error',e=>{if(e.type==='peer-unavailable'){busyName='';setStatus('nomom');scheduleRetry();if(!store.get('sid',null)&&sheetURL)loadSheet()}else{setStatus('err');scheduleRetry()}});
  peer.on('disconnected',()=>{try{peer.reconnect()}catch(e){}});
  render();
}

function onMsg(m){
  if(!m||typeof m!=='object')return;
  switch(m.t){
    case 'busy': if(role==='kid'){const first=status!=='busy';busyName=String(m.name||'');setStatus('busy');if(first)toast(busyName?'媽媽現在在陪'+busyName+'，你可以先自己練習':'你可以先自己練習')}break;
    case 'hello': if(role==='mom')send({t:'roster',list:STUDENTS,at:studentsAt});break;
    case 'roster': if(role==='kid'&&Array.isArray(m.list)&&m.list.length){adoptStudents(m.list,m.at||1);kidIdentify()}break;
    case 'iam': if(role==='mom'&&m.sid){if(!STUDENTS.some(x=>x.id===m.sid))break;
        const changed=switchStudent(m.sid);mergeProg(m.P);setStatus('on');toast(kidName()+'已加入教室'+(changed?'，已切換到'+kidName()+'的紀錄':''));
        send({t:'sync',nav,S,P,sheet:sheetURL,list:STUDENTS,at:studentsAt});render()}break;
    case 'sync': if(role==='kid'){busyName='';setStatus('on');showStartPop()}
      if(Array.isArray(m.list)&&m.list.length)adoptStudents(m.list,m.at||1);
      nav=m.nav;S=Object.assign({stamped:{}},m.S);if(S.music)setTimeout(()=>showPlayer(S.music),300);if(typeof m.sheet==='string'&&m.sheet){sheetURL=m.sheet;store.set('sheet',sheetURL)}mergeProg(m.P);render();break;
    case 'nav': nav=m.nav;render();break;
    case 'prog': mergeProg(m.P);break;
    case 'music':
      if(m.op==='play'){S.music=m.m;S.musicState='loading';showPlayer(m.m)}
      else if(m.op==='stop'){S.music=null;S.musicState=null;hidePlayer()}
      else{const a=document.querySelector('#mplayer audio');
        if(m.op==='pause'){a?a.pause():ytCmd('pauseVideo')}
        if(m.op==='resume'){if(a){const p=a.play();if(p&&p.catch)p.catch(()=>{})}else ytCmd('playVideo')}}
      renderPenbar();break;
    case 'mstate': S.musicState=m.v;{const el=document.getElementById('mState');if(el)el.textContent=musicStateText[m.v]||''}
      if(role==='mom'&&m.v==='needtap')toast(kidName()+'那邊要點一下播放鍵，請他點影片中間的播放鍵');break;
    case 'ready': if(role==='mom')toast(kidName()+'按了「閃現到媽媽旁邊！」，他的平板可以發出聲音了');break;
    case 'sheet': if(typeof m.v==='string'){sheetURL=m.v;store.set('sheet',m.v)}break;
    case 'ev': if(Array.isArray(m.e))pendingEv.push(m.e);scheduleSave();break;
    case 'say': say(String(m.text));flash(m.hk);break;
    case 'pick': S.picks[m.k]=m.v;render();break;
    case 'tiles': S.tiles[m.k]=m.v;render();break;
    case 'hide': S.hide[m.k]=m.v;S.reveal[m.k]=[];render();break;
    case 'reveal': (S.reveal[m.k]=S.reveal[m.k]||[]).push(m.i);render();break;
    case 'guide': S.guide[m.k]=m.v;render();break;
    case 'stamp': S.stamped[m.k]=1;if(m.sk)catchAnim(m.sk,'媽媽說寫得好！');{const el=$('#stampState');if(el)el.innerHTML=stampStateHTML(m.k)}break;
    case 'sb': (S.boards[m.k]=S.boards[m.k]||[]).push({id:m.id,c:m.c,w:m.w,p:m.p.slice()});redrawAny(m.k);break;
    case 'sp': {const st=(S.boards[m.k]||[]).find(x=>x.id===m.id);if(st){st.p.push(...m.p);redrawAny(m.k)}break}
    case 'undo': S.boards[m.k]=(S.boards[m.k]||[]).filter(x=>x.id!==m.id);redrawAny(m.k);break;
    case 'clear': S.boards[m.k]=[];redrawAny(m.k);break;

    case 'wbpages': S.wbPages=Math.max(S.wbPages||1,+m.v||1);break;
  }
}

/* 測驗 */
function quizItems(T,st){
  const k=key();
  const sd=roundSeed(k);
  if(st.mode==='qa')return shuffle(T.qa,sd+'q').map((q,i)=>({q:q[0],ans:q[1],opts:shuffle([q[1],...q[2]],sd+'o'+i)}));
  const pool=T.kind==='phonics'?T.groups.flatMap(g=>g.words):T.words;
  let list;
  if(T.kind==='vocab'){
    // 單字課：還沒學會的字排前面（只看「今天以前」的紀錄，所以上課中兩台平板的題目不會變）
    const tid=tidOf(nav.u,nav.t);
    const deck=shuffle(pool,roundSeed(topicKey())+'deck').sort((a,b)=>isMastered(tid,a.en)-isMastered(tid,b.en));
    const n=quizCount(T,st);
    if(st.mode==='listen')list=deck.slice(0,n);
    else{list=deck.slice(n,2*n);for(const w of deck){if(list.length>=n)break;if(!list.includes(w))list.push(w)}}
  }else list=shuffle(pool,sd+'t');
  return list.map((w,i)=>{
    const others=shuffle(pool.filter(x=>x!==w),sd+'d'+i).slice(0,3);
    return {w,opts:shuffle([w,...others],sd+'o'+i)};
  });
}
function quizScore(T,st){
  const items=quizItems(T,st),k=key();
  return items.filter((it,i)=>{const p=S.picks[k+'-'+i];return p!=null&&(st.mode==='qa'?it.opts[p]===it.ans:it.opts[p]===it.w)}).length;
}
function quizHTML(T,st){
  const items=quizItems(T,st),k=key();
  if(nav.sub>=items.length){
    const score=quizScore(T,st);
    return `<div class="score"><div>這次答對</div><div class="n">${score} / ${items.length}</div>
      <div class="hint">${score===items.length?'全對，太厲害了！':'按「再做一次」會換一組題目，還沒學會的字會優先出現。'}</div>
      <div class="row"><button class="big ghost" id="redo">再做一次（換題目）</button></div></div>`;
  }
  const it=items[nav.sub],pk=k+'-'+nav.sub,p=S.picks[pk];
  const correct=o=>st.mode==='qa'?o===it.ans:o===it.w;
  const answered=p!=null;
  let prompt='';
  if(st.mode==='listen')prompt=`<button class="speak" id="play">🔊 聽聽看</button><span class="hint">聽到的是哪一個？</span>`;
  else if(st.mode==='read')prompt=`${picHTML(it.w.pic)}<span class="z">${esc(it.w.zh)}</span><span class="hint">英文怎麼拼？</span>`;
  else prompt=`<button class="speak" id="play">🔊</button><span class="q">${esc(it.q)}</span>`;
  const optHTML=(o,i)=>{
    let cls='opt';
    if(answered){if(correct(o))cls+=' right';else if(i===p)cls+=' wrong';else cls+=' dim'}
    const inner=st.mode==='qa'?esc(o):st.mode==='listen'?`${picHTML(o.pic)}<span>${esc(o.en)}</span>`:`<span>${esc(o.en)}</span>`;
    return `<button class="${cls}" data-o="${i}" ${answered?'disabled':''}>${inner}</button>`;
  };
  const ok=answered&&correct(it.opts[p]);
  return `<div class="qhead"><h3>${esc(st.label)}</h3><span class="qnum">第 ${nav.sub+1} 題 / 共 ${items.length} 題</span>${masteryHTML(T)}</div>${tipHTML(st)}
  <div class="prompt">${prompt}</div>
  <div class="opts" style="${st.mode==='qa'?'grid-template-columns:1fr':''}">${it.opts.map(optHTML).join('')}</div>
  <div class="verdict ${answered?(ok?'ok':'no'):''}">${answered?(ok?'答對了！抓到一隻怪獸！':'差一點！綠色的才是正確答案，一起念一次。'):''}</div>
  ${answered?`<div class="row"><button class="big" id="nextq">${nav.sub<items.length-1?'下一題 →':'看成績'}</button></div>`:''}`;
}
/* 排句子 */
function tilesOf(s){return s.split(' ')}
function buildHTML(T,st){

  const tiles=tilesOf(sent),order=shuffle(tiles.map((_,j)=>j),roundSeed(k)+'b'+i);

}

/* ===================== 綁定事件 ===================== */
function bindStep(U,T,st){
  const k=key(),tid=tidOf(nav.u,nav.t);
  if(st.type==='words'){
    document.querySelectorAll('.wcard').forEach(b=>b.onclick=()=>{const i=+b.dataset.i,w=T.words[i];
      if(S.hide[k]&&!(S.reveal[k]||[]).includes(i))act({t:'reveal',k,i});
      sayShared(w.en,`${k}-${i}`)});
    document.querySelectorAll('[data-ph]').forEach(b=>b.onclick=()=>sayShared(T.phrases[+b.dataset.ph][0],b.dataset.hk));
    $('#hideBtn').onclick=()=>act({t:'hide',k,v:!S.hide[k]});
  }
  if(st.type==='phonics'){
    document.querySelectorAll('.wcard').forEach(b=>b.onclick=()=>sayShared(T.groups[+b.dataset.g].words[+b.dataset.wi].en,b.dataset.hk));
  }
  if(st.type==='dialog'){
    document.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>sayShared(b.dataset.say,b.dataset.hk));
  }
  if(st.type==='quiz'){
    const items=quizItems(T,st);
    if(nav.sub>=items.length){$('#redo').onclick=()=>{items.forEach((_,i)=>act({t:'pick',k:k+'-'+i,v:null}));const rk=T.kind==='vocab'?topicKey():k;act({t:'round',k:rk,v:((S.round||{})[rk]||0)+1});go({sub:0})};return}
    const it=items[nav.sub];
    const play=$('#play');if(play)play.onclick=()=>sayShared(st.mode==='qa'?it.q:it.w.en);
    document.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{const v=+b.dataset.o;act({t:'pick',k:k+'-'+nav.sub,v});
      const o=it.opts[v];if(st.mode!=='qa')sayShared(o.en);
      const right=st.mode==='qa'?o===it.ans:o===it.w;
      if(right)award(`q|${tid}|${nav.s}|${st.mode==='qa'?it.q:it.w.en}`);
      if(nav.sub===items.length-1){const sc=quizScore(T,st);
        logEv(`測驗：${U.en} ${T.title}「${st.label}」${sc}/${items.length}`);
        if(sc===items.length&&grantBadge('perfect'))progChanged()}});
    const nq=$('#nextq');if(nq)nq.onclick=()=>go({sub:nav.sub+1});
  }
  if(st.type==='build'){
    const i=Math.min(nav.sub,T.build.length-1),tk=k+'-'+i,sent=T.build[i];
    $('#play').onclick=()=>sayShared(sent);
    document.querySelectorAll('.pool .tile').forEach(b=>b.onclick=()=>{const j=+b.dataset.t,cur=S.tiles[tk]||[];if(cur.includes(j))return;
      const nv=cur.concat(j);act({t:'tiles',k:tk,v:nv});
      if(nv.length===tilesOf(sent).length&&nv.map(x=>tilesOf(sent)[x]).join(' ')===sent){sayShared(sent);award(`b|${tid}|${nav.s}|${i}`)}});
    document.querySelectorAll('.slot .tile').forEach(b=>b.onclick=()=>{const n=+b.dataset.back,cur=(S.tiles[tk]||[]).slice();cur.splice(n,1);act({t:'tiles',k:tk,v:cur})});
    $('#resetT').onclick=()=>act({t:'tiles',k:tk,v:[]});
    const nb=$('#nextb');if(nb)nb.onclick=()=>go({sub:i+1});
  }
  if(st.type==='write'){
    const i=Math.min(nav.sub,st.items.length-1),bk=key(i),word=st.items[i];
    $('#play').onclick=()=>sayShared(word);
    $('#guideBtn').onclick=()=>act({t:'guide',k:bk,v:S.guide[bk]===false});
    $('#undo').onclick=()=>{const mine=(S.boards[bk]||[]).filter(s=>s.id.startsWith(myTag()));if(mine.length)act({t:'undo',k:bk,id:mine[mine.length-1].id})};
    $('#clr').onclick=()=>act({t:'clear',k:bk});
    $('#pv').onclick=()=>go({sub:i-1});
    $('#nx').onclick=()=>go({sub:i+1});
    const sb=$('#stamp');
    if(sb)sb.onclick=()=>{const sk=`s|${tid}|${nav.s}|${i}`;act({t:'stamp',k:bk,sk});
      const fresh=award(sk,'媽媽說寫得好！');
      if(fresh)logEv(`媽媽蓋章：${word}`);
      if(word==='Wednesday'&&grantBadge('wed'))progChanged()};
    setupBoard(word,bk);
  }
}

/* ===================== 四線格寫字板 ===================== */
const LW=1000; // 邏輯寬度，兩台平板座標一致
let board=null;
function myTag(){return role==='mom'?'m':'k'}
function myColor(){return role==='mom'?'#d43a33':'#1f5fd6'}
// 標準四線三格：三格等寬（u）。範字用「分段垂直縮放」放進格子：大寫/上伸到第1條線、小寫身體在中間格、下伸到第4條線
const FONT=sz=>`700 ${sz}px Andika, "Comic Sans MS", sans-serif`;
function metrics(ctx,size){
  ctx.font=FONT(size);
  const A=c=>ctx.measureText(c).actualBoundingBoxAscent,D=c=>ctx.measureText(c).actualBoundingBoxDescent;
  const asc=Math.max(A('H')||0,A('l')||0,A('d')||0)||size*.72,xh=A('x')||size*.5,desc=Math.max(D('g')||0,D('y')||0,D('p')||0)||size*.24;
  const u=size*.45,pad=u*.75;   // 格子加高，手寫比較好對齊
  return {size,asc,xh,desc,u,pad,rowH:3*u+2*pad};
}
function layoutText(ctx,text){
  ctx.font=FONT(100);const w1=ctx.measureText(text).width;
  let lines=[text],size=Math.min(190,(LW-80)/w1*100);
  if(size<120){
    const words=text.split(' ');let best=null;
    for(let c=1;c<words.length;c++){const a=words.slice(0,c).join(' '),b=words.slice(c).join(' ');const m=Math.max(ctx.measureText(a).width,ctx.measureText(b).width);if(!best||m<best.m)best={m,a,b}}
    if(best){lines=[best.a,best.b];size=Math.min(160,(LW-80)/best.m*100)}
  }
  const M=metrics(ctx,size);
  return Object.assign(M,{lines,H:Math.round(M.rowH*lines.length+20)});
}
function layoutBlank(ctx,rows){
  const M=metrics(ctx,140);
  return Object.assign(M,{lines:Array(rows).fill(''),H:Math.round(M.rowH*rows+20)});
}
function penWidth(L){return Math.max(16,Math.round(L.size*.15))}   // 跟範字的筆畫差不多粗
function guideImage(line,L,s){
  // 先把範字畫在暫存畫布上，之後分三段貼進四線格
  const key=line+'|'+L.size+'|'+s;board.cache=board.cache||{};if(board.cache[key])return board.cache[key];
  const off=document.createElement('canvas');off.width=Math.ceil(LW*s);off.height=Math.ceil((L.asc+L.desc+20)*s);
  const c=off.getContext('2d');c.setTransform(s,0,0,s,0,0);c.font=FONT(L.size);c.fillStyle='#d3dbe1';c.textBaseline='alphabetic';c.fillText(line.replace(/i/g,'\u0131').replace(/j/g,'\u0237'),40,10+L.asc);
  return board.cache[key]=off;
}
function setupBoard(text,bk,rows){
  const cv=$('#board');const ctx=cv.getContext('2d');
  const lay=()=>rows?layoutBlank(ctx,rows):layoutText(ctx,text);
  const L=lay();
  board={cv,ctx,L,text,bk,blank:!!rows};
  const fit=()=>{const r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1,L2=board.L;cv.style.height=(r.width*L2.H/LW)+'px';
    cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.width*L2.H/LW*dpr);boardRedraw(bk)};
  fit();
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(board&&board.bk===bk&&document.body.contains(cv)){board.L=lay();fit()}});
  window.onresize=()=>{if(board&&board.bk===bk&&document.body.contains(cv))fit()};
  let cur=null,buf=[],timer=null,n=0;
  const pt=e=>{const r=cv.getBoundingClientRect();return [Math.round((e.clientX-r.left)/r.width*LW*10)/10,Math.round((e.clientY-r.top)/r.width*LW*10)/10]};
  const flush=()=>{if(cur&&buf.length){send({t:'sp',k:bk,id:cur.id,p:buf});buf=[]}};
  cv.onpointerdown=e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);
    const p=pt(e);cur={id:myTag()+Date.now().toString(36)+(n++),c:myColor(),w:penWidth(board.L),p:p};
    (S.boards[bk]=S.boards[bk]||[]).push(cur);send({t:'sb',k:bk,id:cur.id,c:cur.c,w:cur.w,p:p});
    timer=setInterval(flush,60);boardRedraw(bk)};
  cv.onpointermove=e=>{if(!cur)return;e.preventDefault();const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
    for(const ev of evs){const p=pt(ev);cur.p.push(...p);buf.push(...p)}boardRedraw(bk)};
  const end=()=>{if(!cur)return;flush();clearInterval(timer);cur=null};
  cv.onpointerup=end;cv.onpointercancel=end;cv.onpointerleave=end;
}
function boardRedraw(bk){
  if(!board||board.bk!==bk||!document.body.contains(board.cv))return;
  const {cv,ctx,L}=board;const s=cv.width/LW;
  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);ctx.setTransform(s,0,0,s,0,0);
  L.lines.forEach((line,r)=>{
    const u=L.u,base=10+r*L.rowH+L.pad+2*u;
    if(board.blank&&S.guide[bk]===false)return;
    // 四條線等距；第三條（基準線）紅色
    [base-2*u,base-u,base,base+u].forEach((y,j)=>{ctx.beginPath();ctx.moveTo(20,y);ctx.lineTo(LW-20,y);ctx.lineWidth=j===2?2.6:1.6;ctx.strokeStyle=j===2?'#e07a74':'#9cc3d9';ctx.stroke()});
    if(line&&S.guide[bk]!==false){
      const img=guideImage(line,L,s),a0=10,a1=10+L.asc-L.xh,a2=10+L.asc,a3=10+L.asc+L.desc;
      ctx.drawImage(img,0,a0*s,img.width,(a1-a0)*s,0,base-2*u,img.width/s,u);
      ctx.drawImage(img,0,a1*s,img.width,(a2-a1)*s,0,base-u,img.width/s,u);
      ctx.drawImage(img,0,a2*s,img.width,(a3-a2)*s,0,base,img.width/s,u);
      // i、j 的點：畫在最上面那格的中間，保持圓形
      ctx.font=FONT(L.size);ctx.fillStyle='#d3dbe1';
      for(let ci=0;ci<line.length;ci++){const ch=line[ci];if(ch!=='i'&&ch!=='j')continue;
        const x0=40+ctx.measureText(line.slice(0,ci).replace(/i/g,'\u0131').replace(/j/g,'\u0237')).width,w=ctx.measureText(ch==='i'?'\u0131':'\u0237').width;
        ctx.beginPath();ctx.arc(x0+w*(ch==='j'?.62:.5),base-1.45*u,L.size*.075,0,Math.PI*2);ctx.fill()}
    }
  });
  drawStrokes(ctx,S.boards[bk]||[]);
}
function drawStrokes(ctx,list){
  ctx.lineCap='round';ctx.lineJoin='round';
  for(const st of list){
    const p=st.p;ctx.strokeStyle=st.c;ctx.fillStyle=st.c;ctx.lineWidth=st.w;
    if(p.length<=2){ctx.beginPath();ctx.arc(p[0],p[1],st.w/2,0,Math.PI*2);ctx.fill();continue}
    ctx.beginPath();ctx.moveTo(p[0],p[1]);
    for(let i=2;i<p.length-2;i+=2){const mx=(p[i]+p[i+2])/2,my=(p[i+1]+p[i+3])/2;ctx.quadraticCurveTo(p[i],p[i+1],mx,my)}
    ctx.lineTo(p[p.length-2],p[p.length-1]);ctx.stroke();
  }
}


/* ===================== 畫筆：整個網頁都能畫 ===================== */
let penOn=false;
const inkKey=()=>'ink:'+[nav.u,nav.t,nav.s,nav.sub].join('-');
function redrawAny(k){if(String(k).startsWith('ink:')){if(k===inkKey()){inkRedraw();renderPenbar()}}else boardRedraw(k)}
function inkFit(){
  const pg=$('#page'),cv=$('#ink');if(!pg||!cv)return;
  const app=$('#app'),w=pg.clientWidth,h=Math.max(app.offsetHeight,window.innerHeight-10),dpr=window.devicePixelRatio||1;  // 用內容高度，不用畫布自己撐出來的高度
  if(cv._w!==w||cv._h!==h){cv.style.width=w+'px';cv.style.height=h+'px';cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);cv._w=w;cv._h=h}
  inkRedraw();
}
function inkRedraw(){
  const cv=$('#ink');if(!cv||!cv.width)return;const ctx=cv.getContext('2d'),s=cv.width/LW;
  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);ctx.setTransform(s,0,0,s,0,0);
  drawStrokes(ctx,S.boards[inkKey()]||[]);
}
function renderPenbar(){
  const pb=$('#penbar');document.body.classList.toggle('pen',penOn);
  pb.innerHTML=`<button class="pen ${penOn?'on':''}" id="penT"><span class="ic">✏️</span>${penOn?'畫筆中<br>按這裡收起':'畫筆'}</button>`+
    (penOn?`<button id="penU"><span class="ic">↶</span>復原</button>`:'')+
    ((S.boards[inkKey()]||[]).length?`<button id="penC"><span class="ic">🧽</span>擦掉畫記</button>`:'')+
    (role==='mom'?`<button id="musicT" class="${S.music?'on':''}"><span class="ic">🎵</span>${S.music?'播放中':'播音樂'}</button>`:'');
  $('#penT').onclick=()=>{penOn=!penOn;renderPenbar();if(penOn)toast('畫筆開了：畫面上任何地方都能畫。要點按鈕或捲動時，先把畫筆收起來')};
  const u=$('#penU');if(u)u.onclick=()=>{const k=inkKey(),mine=(S.boards[k]||[]).filter(x=>x.id.startsWith(myTag()));if(mine.length)act({t:'undo',k,id:mine[mine.length-1].id});renderPenbar()};
  const c=$('#penC');if(c)c.onclick=()=>{act({t:'clear',k:inkKey()});renderPenbar()};
  const mt=$('#musicT');if(mt)mt.onclick=openMusicPanel;
}
/* ===================== 播音樂給兒子聽（只有媽媽看得到按鈕；聲音只從兒子的平板出來） ===================== */
function parseMusic(url){
  url=(url||'').trim();
  const yt=url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/))([A-Za-z0-9_-]{11})/);
  if(yt)return {kind:'yt',id:yt[1]};
  if(/^https?:\/\/\S+\.(mp3|m4a|aac|wav|ogg)(\?\S*)?$/i.test(url))return {kind:'audio',src:url};
  return null;
}
const musicStateText={playing:'▶ 孩子那邊正在播放',paused:'⏸ 已暫停',ended:'播完了',needtap:'孩子那邊要點一下播放鍵（第一次可能會這樣）',loading:'正在打開…'};
function openMusicPanel(){
  document.querySelectorAll('.mpanel').forEach(e=>e.remove());
  const o=document.createElement('div');o.className='overlay mpanel';
  const m=S.music;
  o.innerHTML=`<div class="mbox"><div class="mhead">🎵 播音樂給${esc(kidName())}聽</div>
    ${m?`<div class="mnow"><b>正在播放</b><span id="mState">${esc(musicStateText[S.musicState]||musicStateText.loading)}</span></div>
      <div class="row"><button class="big ghost" id="mPause">⏸ 暫停</button><button class="big ghost" id="mResume">▶ 繼續</button><button class="big" id="mStop">■ 停止</button></div>
      <p class="hint">要換一首，直接在下面貼新的連結。</p>`:''}
    <div class="row"><input id="mUrl" type="url" placeholder="貼上 YouTube 連結" autocomplete="off"><button class="big ghost" id="mPaste">📋 貼上</button></div>
    <div class="row"><button class="big" id="mPlay">播放給${esc(kidName())}聽</button><button class="big ghost" id="mClose">關閉</button></div>
    <p class="hint">${momMute?'目前聲音設定是「只有'+kidName()+'」：音樂只從他的平板播，你透過 FaceTime 聽。':'目前聲音設定是「兩邊」：你這台也會一起播。'}要改的話，到首頁的「⚙️ 設定」切換。支援 YouTube 連結或 mp3 檔的網址。</p></div>`;
  document.body.appendChild(o);
  const q=id=>o.querySelector('#'+id);
  q('mClose').onclick=()=>o.remove();
  o.onclick=e=>{if(e.target===o)o.remove()};
  q('mPaste').onclick=async()=>{try{q('mUrl').value=await navigator.clipboard.readText()}catch(e){q('mUrl').focus();toast('請長按輸入框，選「貼上」')}};
  q('mPlay').onclick=()=>{
    if(status!=='on'){toast(kidName()+'還沒連線，連上之後才能播放給他聽');return}
    const pm=parseMusic(q('mUrl').value);
    if(!pm){toast('看不懂這個連結，請貼 YouTube 的分享連結，或 mp3 檔的網址');return}
    S.musicState='loading';act({t:'music',op:'play',m:Object.assign(pm,{ts:Date.now()})});logEv('媽媽播音樂');o.remove();toast('已經送到'+kidName()+'的平板');
  };
  if(m){q('mPause').onclick=()=>act({t:'music',op:'pause'});q('mResume').onclick=()=>act({t:'music',op:'resume'});
    q('mStop').onclick=()=>{act({t:'music',op:'stop'});o.remove()}}
}
// 兒子這邊的播放器
let ytListenT=null,needTapT=null;
function sendMusicState(st){if(role!=='kid')return;S.musicState=st;send({t:'mstate',v:st})}
function ytCmd(func){const f=document.querySelector('#mplayer iframe');if(f&&f.contentWindow)f.contentWindow.postMessage(JSON.stringify({event:'command',func,args:[]}),'*')}
function showPlayer(m){
  hidePlayer();if(!m||!(role==='kid'||(role==='mom'&&!momMute)))return;   // 媽媽這邊：聲音開關選「兩邊」才一起播
  const el=document.createElement('div');el.id='mplayer';
  const body=m.kind==='yt'
    ?`<iframe src="https://www.youtube.com/embed/${m.id}?autoplay=1&playsinline=1&rel=0&enablejsapi=1&origin=${encodeURIComponent(location.origin)}" allow="autoplay; encrypted-media" allowfullscreen title="媽媽放的歌"></iframe>`
    :`<audio src="${esc(m.src)}" controls autoplay playsinline></audio>`;
  el.innerHTML=`<div class="mtitle">🎵 媽媽放的歌</div>${body}<div class="mtap" hidden>👆 點一下上面的播放鍵</div>`;
  document.body.appendChild(el);
  const tapHint=()=>{el.querySelector('.mtap').hidden=false;sendMusicState('needtap')};
  if(m.kind==='yt'){
    const f=el.querySelector('iframe');
    f.onload=()=>{let n=0;clearInterval(ytListenT);ytListenT=setInterval(()=>{if(++n>10)clearInterval(ytListenT);try{f.contentWindow.postMessage(JSON.stringify({event:'listening',id:1}),'*')}catch(e){}},400)};
    needTapT=setTimeout(()=>{if(S.musicState!=='playing')tapHint()},5000);
  }else{
    const a=el.querySelector('audio');
    a.onplay=()=>{el.querySelector('.mtap').hidden=true;sendMusicState('playing')};a.onpause=()=>sendMusicState('paused');a.onended=()=>sendMusicState('ended');
    const p=a.play();if(p&&p.catch)p.catch(tapHint);
  }
}
function hidePlayer(){clearInterval(ytListenT);clearTimeout(needTapT);const el=document.getElementById('mplayer');if(el)el.remove()}
window.addEventListener('message',e=>{
  if(role!=='kid'||!/youtube\.com$/.test(new URL(e.origin||'http://x').hostname))return;
  let d;try{d=typeof e.data==='string'?JSON.parse(e.data):e.data}catch(err){return}
  const ps=d&&d.info&&d.info.playerState;if(ps===undefined)return;
  const map={1:'playing',2:'paused',0:'ended'};
  if(map[ps]&&map[ps]!==S.musicState){sendMusicState(map[ps]);if(ps===1){const t=document.querySelector('#mplayer .mtap');if(t)t.hidden=true}}
});
(function setupInk(){
  const cv=$('#ink');let cur=null,buf=[],timer=null,n=0,k=null;
  const pt=e=>{const r=$('#page').getBoundingClientRect();return [Math.round((e.clientX-r.left)/r.width*LW*10)/10,Math.round((e.clientY-r.top)/r.width*LW*10)/10]};
  const flush=()=>{if(cur&&buf.length){send({t:'sp',k,id:cur.id,p:buf});buf=[]}};
  cv.addEventListener('pointerdown',e=>{if(!penOn)return;e.preventDefault();cv.setPointerCapture(e.pointerId);k=inkKey();
    const p=pt(e);cur={id:myTag()+Date.now().toString(36)+'i'+(n++),c:myColor(),w:16,p:p};
    (S.boards[k]=S.boards[k]||[]).push(cur);send({t:'sb',k,id:cur.id,c:cur.c,w:cur.w,p:p});timer=setInterval(flush,60);inkRedraw()});
  cv.addEventListener('pointermove',e=>{if(!cur)return;e.preventDefault();const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
    for(const ev of evs){const p=pt(ev);cur.p.push(...p);buf.push(...p)}inkRedraw()});
  const end=()=>{if(!cur)return;flush();clearInterval(timer);cur=null;renderPenbar()};
  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  if(window.ResizeObserver)new ResizeObserver(()=>inkFit()).observe($('#app'));
  window.addEventListener('resize',()=>inkFit());
})();

/* ===================== 白板（隨時可以打開） ===================== */
function openWB(){const back={u:nav.u,t:nav.t,s:nav.s,sub:nav.sub};go({u:-3,sub:0,back})}
function whiteboardHTML(){
  const i=nav.sub,k='wb-'+i,pages=Math.max(S.wbPages||1,i+1),grid=S.guide[k]!==false;
  const back=nav.back&&nav.back.u>=0?'← 回到課程':'← 地圖';
  return `<div class="top"><button class="iconbtn" id="wbBack">${back}</button><div class="crumb"><b>白板</b></div>${kjChip()}<span class="chip" id="chip"></span></div>
  <div class="stage">
    ${role!=='kid'?'<p class="tip"><b>用法：</b>媽媽念一個字或一句話，孩子寫在格子裡；媽媽用紅筆幫他改。一頁寫滿了按「新的一頁」。</p>':''}
    <div class="wbtools">
      <button class="toggle ${grid?'on':''}" id="gridBtn">${grid?'四線格：開':'四線格：關'}</button>
      <button class="toggle" id="undo">↶ 復原我的上一筆</button>
      <button class="toggle" id="clr">這頁全部擦掉</button>
      <span class="legend"><i style="background:var(--pen-me)"></i>${esc(kidName())}</span><span class="legend"><i style="background:var(--pen-mom)"></i>媽媽</span>
      <span style="flex:1"></span>
      <div class="pager"><button class="toggle" id="pv" ${i===0?'disabled':''}>←</button><span>第 ${i+1} / ${pages} 頁</span><button class="toggle" id="nx" ${i>=pages-1?'disabled':''}>→</button></div>
      <button class="toggle" id="newp">＋ 新的一頁</button>
    </div>
    <canvas class="board" id="board"></canvas>
  </div>`;
}
function bindWhiteboard(){
  const i=nav.sub,k='wb-'+i,pages=Math.max(S.wbPages||1,i+1);
  $('#wbBack').onclick=()=>{const b=nav.back;go(b&&b.u>=0?Object.assign({back:null},b):{u:-1,back:null})};
  $('#gridBtn').onclick=()=>act({t:'guide',k,v:S.guide[k]===false});
  $('#undo').onclick=()=>{const mine=(S.boards[k]||[]).filter(s=>s.id.startsWith(myTag()));if(mine.length)act({t:'undo',k,id:mine[mine.length-1].id})};
  $('#clr').onclick=()=>act({t:'clear',k});
  $('#pv').onclick=()=>go({sub:i-1});
  $('#nx').onclick=()=>go({sub:i+1});
  $('#newp').onclick=()=>{act({t:'wbpages',v:pages+1});go({sub:pages})};
  setupBoard('',k,4);
}

checkBadges();celeQueue=[];   // 開啟時不重播舊徽章
render();booted=true;
{const su=new URLSearchParams(location.search).get('sheet');if(su&&/^https:\/\/script\.google(usercontent)?\.com\//.test(su)&&su!==sheetURL){sheetURL=su;store.set('sheet',su)}}
loadSheet();

else if(role==='kid'&&code)startKid(new URLSearchParams(location.search).get('room')||code);
